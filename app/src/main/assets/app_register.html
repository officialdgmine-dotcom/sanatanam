<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SANATANAM — नया सदस्य पंजीकरण</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --bhagwa: #FF7700;
        --bhagwa-deep: #D44000;
        --lava: #8A0000;
        --gold: #FFD54F;
        --gold-border: #D4A017;
        --bg-grad: radial-gradient(circle at top, #FF8800 0%, #B82E00 45%, #4A0000 100%);
    }

    * { 
        box-sizing: border-box; 
        -webkit-tap-highlight-color: transparent; 
    }
    
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg-grad);
        font-family: 'Noto Sans Devanagari', sans-serif;
        color: #222;
    }

    body {
        padding: 16px 12px 35px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .app-card {
        width: 100%;
        max-width: 440px;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-radius: 28px;
        border: 2px solid var(--gold-border);
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        padding: 24px 18px;
        position: relative;
    }

    .app-card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 6px;
        border-radius: 28px 28px 0 0;
        background: linear-gradient(90deg, var(--bhagwa), var(--gold), var(--lava));
    }

    .brand-box { text-align: center; margin-bottom: 18px; }
    .brand-logo-wrap {
        width: 80px;
        height: 80px;
        margin: 0 auto 8px;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, var(--gold), var(--bhagwa));
        box-shadow: 0 8px 20px rgba(138, 0, 0, 0.3);
    }
    .brand-logo {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        background: #fff;
        display: block;
    }
    .brand-title {
        color: var(--lava);
        font-size: 20px;
        font-weight: 900;
        margin: 0;
    }
    .brand-sub {
        color: #6d4c41;
        font-size: 12px;
        font-weight: 700;
        margin-top: 2px;
    }

    .sec-title {
        font-size: 13px;
        font-weight: 800;
        color: var(--lava);
        background: #fff7e6;
        padding: 6px 12px;
        border-radius: 10px;
        border-left: 4px solid var(--bhagwa);
        margin: 16px 0 10px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .form-group { margin-bottom: 12px; }
    .field-label {
        display: block;
        font-size: 12px;
        font-weight: 800;
        color: #4a2c00;
        margin-bottom: 4px;
    }
    .input-box, .select-box, .textarea-box {
        width: 100%;
        padding: 0 12px;
        height: 46px;
        border: 1.5px solid #e0c9a6;
        background: #fffdf9;
        border-radius: 12px;
        font-size: 13.5px;
        font-weight: 600;
        font-family: inherit;
        outline: none;
        transition: 0.2s ease;
    }
    .textarea-box {
        height: 68px;
        padding: 8px 12px;
        resize: none;
    }
    .input-box:focus, .select-box:focus, .textarea-box:focus {
        border-color: var(--bhagwa);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(255, 119, 0, 0.15);
    }
    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .pincode-status {
        font-size: 11px;
        font-weight: 700;
        margin-top: 3px;
        display: none;
    }
    .pincode-success { color: #2e7d32; display: block; }
    .pincode-loading { color: var(--bhagwa-deep); display: block; }
    .pincode-error { color: var(--lava); display: block; }

    .photo-upload-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fffbf2;
        border: 1.5px dashed var(--gold-border);
        padding: 8px 12px;
        border-radius: 12px;
    }
    .preview-avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--bhagwa);
        background: #eee;
    }
    .upload-info { flex: 1; font-size: 11.5px; }
    .upload-btn-label {
        display: inline-block;
        padding: 5px 10px;
        background: linear-gradient(135deg, var(--bhagwa), var(--bhagwa-deep));
        color: #fff;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
        margin-top: 3px;
    }

    .btn-register-main {
        width: 100%;
        height: 50px;
        margin-top: 18px;
        background: linear-gradient(135deg, var(--bhagwa), var(--lava));
        border: none;
        border-radius: 14px;
        color: #fff;
        font-size: 15px;
        font-weight: 900;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(184, 46, 0, 0.35);
        transition: 0.2s ease;
    }
    .btn-register-main:active { transform: scale(0.98); }

    .btn-login-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        width: 100%;
        margin-top: 12px;
        background: #fff8e1;
        border: 1.5px solid var(--gold-border);
        color: #7a3e00;
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
        border-radius: 12px;
    }

    .alert-box {
        display: none;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 12.5px;
        font-weight: 700;
        margin-bottom: 12px;
        text-align: center;
    }
    .alert-error {
        background: #ffebee;
        color: var(--lava);
        border: 1px solid #ffcdd2;
    }
</style>
</head>
<body>

<div class="app-card">
    <div class="brand-box">
        <div class="brand-logo-wrap">
            <img src="https://sanatansevasamiti.org/Images/logo.jpg" alt="Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/84';">
        </div>
        <h1 class="brand-title">सनातन सेवा समिति</h1>
        <div class="brand-sub">SANATANAM • नया सदस्य पंजीकरण</div>
    </div>

    <div id="alertMsg" class="alert-box alert-error"></div>

    <form id="registerForm" onsubmit="handleRegistration(event)">
        
        <!-- SECTION 1: सेवा क्षेत्र व नाम -->
        <div class="sec-title">🚩 1. सेवा क्षेत्र एवं व्यक्तिगत विवरण</div>

        <div class="form-group">
            <label class="field-label">सेवा क्षेत्र चुनें *</label>
            <select id="seva_kshetra" class="select-box" required>
                <option value="">-- सेवा क्षेत्र लोड हो रहा है... --</option>
            </select>
        </div>

        <div class="form-group">
            <label class="field-label">पूरा नाम (Full Name) *</label>
            <input type="text" id="full_name" class="input-box" placeholder="उदा. राहुल शर्मा" required>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label class="field-label">लिंग (Gender)</label>
                <select id="gender" class="select-box">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label class="field-label">जन्म तिथि (DOB)</label>
                <input type="date" id="dob" class="input-box">
            </div>
        </div>

        <!-- SECTION 2: संपर्क, देश व ऑटोमैटिक पिनकोड स्थान -->
        <div class="sec-title">📍 2. संपर्क एवं निवास (ऑटोमैटिक स्थान)</div>

        <div class="grid-2">
            <div class="form-group">
                <label class="field-label">देश (Country) *</label>
                <select id="country" class="select-box" onchange="handleCountryChange(this.value)">
                    <!-- विश्व के प्रमुख देश -->
                    <option value="India" selected>🇮🇳 India</option>
                    <option value="Nepal">🇳🇵 Nepal</option>
                    <option value="Bangladesh">🇧🇩 Bangladesh</option>
                    <option value="Sri Lanka">🇱🇰 Sri Lanka</option>
                    <option value="Bhutan">🇧🇹 Bhutan</option>
                    <option value="Mauritius">🇲🇺 Mauritius</option>
                    <option value="United States">🇺🇸 United States</option>
                    <option value="United Kingdom">🇬🇧 United Kingdom</option>
                    <option value="Canada">🇨🇦 Canada</option>
                    <option value="Australia">🇦🇺 Australia</option>
                    <option value="United Arab Emirates">🇦🇪 UAE</option>
                    <option value="Singapore">🇸🇬 Singapore</option>
                    <option value="Fiji">🇫🇯 Fiji</option>
                    <option value="Malaysia">🇲🇾 Malaysia</option>
                    <option value="Other">🌐 Other Country</option>
                </select>
            </div>
            <div class="form-group">
                <label class="field-label">मोबाइल नंबर *</label>
                <input type="tel" id="mobile" class="input-box" placeholder="10 अंकों का मोबाइल" maxlength="10" required>
            </div>
        </div>

        <div class="form-group">
            <label class="field-label">ईमेल पता (Email)</label>
            <input type="email" id="email" class="input-box" placeholder="name@example.com">
        </div>

        <!-- पिनकोड आधारित ऑटो लोकेशन -->
        <div class="form-group" id="pincodeGroup">
            <label class="field-label">पिनकोड (Pincode दर्ज करते ही राज्य व जिला स्वतः भर जाएगा) *</label>
            <input type="number" id="pincode" class="input-box" placeholder="6 अंकों का पिनकोड (उदा. 476001)" oninput="handlePincodeAutoFetch(this.value)">
            <div id="pincodeStatus" class="pincode-status"></div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label class="field-label">राज्य (State) *</label>
                <select id="state" class="select-box" onchange="handleStateSelection(this.value)">
                    <option value="">-- राज्य चुनें --</option>
                </select>
            </div>
            <div class="form-group">
                <label class="field-label">जिला (District) *</label>
                <select id="district" class="select-box">
                    <option value="">-- जिला चुनें --</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="field-label">स्थायी पता (Village / Ward / Street)</label>
            <textarea id="address" class="textarea-box" placeholder="मकान नं, मोहल्ला, गाँव / वार्ड दर्ज करें..."></textarea>
        </div>

        <!-- SECTION 3: फोटो एवं पासवर्ड -->
        <div class="sec-title">📸 3. प्रोफाइल फोटो व सुरक्षा</div>

        <div class="form-group">
            <label class="field-label">प्रोफाइल फोटो</label>
            <div class="photo-upload-wrap">
                <img id="avatarPreview" src="https://via.placeholder.com/55?text=Photo" class="preview-avatar" alt="Avatar">
                <div class="upload-info">
                    <span style="color:#666; font-weight:700;">स्पष्ट पासपोर्ट साइज़ फोटो चुनें</span><br>
                    <label for="profile_photo" class="upload-btn-label">📁 फोटो गैलरी खोलें</label>
                    <input type="file" id="profile_photo" accept="image/*" style="display:none;" onchange="previewUserPhoto(event)">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="field-label">लॉगिन पासवर्ड बनाएं *</label>
            <input type="password" id="password" class="input-box" placeholder="कम से कम 6 अक्षरों का पासवर्ड" minlength="6" required>
        </div>

        <button type="submit" id="btnSubmit" class="btn-register-main">।। सदस्य पंजीकरण पूर्ण करें ।।</button>
    </form>

    <a href="app_login.html" class="btn-login-footer">🚀 पहले से खाता है? लॉगिन करें</a>
</div>

<script>
const REGISTER_API = "https://sanatansevasamiti.org/api/register.php";
let photoBase64 = "";

// भारत के सभी राज्य
const INDIA_STATES = [
    "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chhattisgarh", 
    "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand", 
    "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur", 
    "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Punjab", 
    "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana", "Tripura", 
    "Uttar Pradesh", "Uttarakhand", "West Bengal", "Andaman and Nicobar Islands", 
    "Chandigarh", "Dadra and Nagar Haveli and Daman and Diu", "Delhi", 
    "Jammu and Kashmir", "Ladakh", "Lakshadweep", "Puducherry"
];

// प्रमुख जिलों की सूची
const STATE_DISTRICTS_DATA = {
    "Madhya Pradesh": ["मुरैना", "ग्वालियर", "भिंड", "श्योपुर", "दतिया", "शिवपुरी", "इंदौर", "भोपाल", "उज्जैन", "जबलपुर", "रीवा", "सतना", "सागर", "बैतूल", "होशंगाबाद", "खंडवा", "खरगोन", "विदिशा", "सीहोर", "रतलाम", "मंदसौर", "नीमच"],
    "Uttar Pradesh": ["आगरा", "मथुरा", "वाराणसी", "अयोध्या", "लखनऊ", "कानपुर", "प्रयागराज", "गोरखपुर", "झाँसी", "अलीगढ़", "मेरठ", "बरेली", "मुरादाबाद", "गाजियाबाद", "नोएडा", "इटावा", "मैनपुरी", "फिरोजाबाद"],
    "Rajasthan": ["जयपुर", "जोधपुर", "कोटा", "बीकानेर", "अजमेर", "उदयपुर", "भरतपुर", "धौलपुर", "अलवर", "सीकर", "दौसा", "सवाई माधोपुर"],
    "Delhi": ["नई दिल्ली", "उत्तर दिल्ली", "दक्षिण दिल्ली", "पूर्व दिल्ली", "पश्चिम दिल्ली", "मध्य दिल्ली"],
    "Bihar": ["पटना", "गया", "मुजफ्फरपुर", "भागलपुर", "दरभंगा", "पूर्णिया", "नालंदा", "आरा"]
};

// फॉलबैक सेवा क्षेत्र सूची
const DEFAULT_SEVA_KSHETRA = [
    { profile_id: "PRO1781011172", name: "सनातन सेवा समिति (मुख्य)" },
    { profile_id: "PRO1781011341", name: "आनंद लहरी" },
    { profile_id: "PRO1781285901", name: "सत्य सनातन मार्ग" },
    { profile_id: "PRO1781287765", name: "सनातन धर्म आश्रम" },
    { profile_id: "PRO1781288688", name: "श्री शिवशक्ति वैदिक गुरुकुलम" },
    { profile_id: "PRO1781289469", name: "प्रकृति संरक्षण" },
    { profile_id: "PRO1781367447", name: "श्री शिव शक्ति शिक्षा केंद्र" },
    { profile_id: "PRO1781289610", name: "जीव सेवा" },
    { profile_id: "PRO1781290640", name: "निःशुल्क स्वास्थ्य सेवा" },
    { profile_id: "PRO1781291019", name: "निराश्रित जन सेवा" },
    { profile_id: "PRO1781313938", name: "वृद्ध जन सेवा" },
    { profile_id: "PRO1781318323", name: "राष्ट्रीय सनातन रक्षा सेना" },
    { profile_id: "PRO1781368186", name: "संत सेना" },
    { profile_id: "PRO1781318500", name: "भवानी सेना" },
    { profile_id: "PRO1781319711", name: "वेद सेना" }
];

window.addEventListener("DOMContentLoaded", () => {
    loadStatesDropdown();
    loadSevaKshetraList();
});

// 1. राज्यों का ड्रॉपडाउन तैयार करना
function loadStatesDropdown() {
    const stateSel = document.getElementById("state");
    stateSel.innerHTML = '<option value="">-- राज्य चुनें --</option>';
    INDIA_STATES.forEach(st => {
        const opt = document.createElement("option");
        opt.value = st;
        opt.textContent = st;
        stateSel.appendChild(opt);
    });
}

// 2. राज्य चुनने पर जिलों का स्वतः अपडेट
function handleStateSelection(selectedState, autoDistrict = "") {
    const distSel = document.getElementById("district");
    distSel.innerHTML = '<option value="">-- जिला चुनें --</option>';

    const distList = STATE_DISTRICTS_DATA[selectedState] || [];
    
    if (autoDistrict && !distList.includes(autoDistrict)) {
        distList.unshift(autoDistrict);
    }

    if (distList.length > 0) {
        distList.forEach(d => {
            const opt = document.createElement("option");
            opt.value = d;
            opt.textContent = d;
            if (autoDistrict && autoDistrict.toLowerCase().includes(d.toLowerCase())) {
                opt.selected = true;
            }
            distSel.appendChild(opt);
        });
    } else {
        const opt = document.createElement("option");
        opt.value = autoDistrict || selectedState;
        opt.textContent = autoDistrict || selectedState;
        opt.selected = true;
        distSel.appendChild(opt);
    }
}

// 3. भारत के पिनकोड से राज्य व जिला स्वतः प्राप्त करना
async function handlePincodeAutoFetch(pin) {
    const statusBox = document.getElementById("pincodeStatus");
    pin = pin.trim();

    if (pin.length !== 6) {
        statusBox.style.display = "none";
        return;
    }

    statusBox.className = "pincode-status pincode-loading";
    statusBox.innerText = "⏳ पिनकोड से स्थान खोजा जा रहा है...";

    try {
        const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
        const data = await res.json();

        if (data && data[0] && data[0].Status === "Success") {
            const postOffice = data[0].PostOffice[0];
            const detectedState = postOffice.State;
            const detectedDistrict = postOffice.District;

            // राज्य सेलेक्ट करना
            const stateSel = document.getElementById("state");
            let stateMatched = false;
            for (let i = 0; i < stateSel.options.length; i++) {
                if (stateSel.options[i].value.toLowerCase() === detectedState.toLowerCase()) {
                    stateSel.selectedIndex = i;
                    stateMatched = true;
                    break;
                }
            }
            if (!stateMatched) {
                const newOpt = new Option(detectedState, detectedState, true, true);
                stateSel.add(newOpt);
            }

            // जिले का स्वतः चयन
            handleStateSelection(detectedState, detectedDistrict);

            statusBox.className = "pincode-status pincode-success";
            statusBox.innerText = `✓ स्थान मिला: ${detectedDistrict}, ${detectedState}`;
        } else {
            statusBox.className = "pincode-status pincode-error";
            statusBox.innerText = "⚠️ पिनकोड का विवरण नहीं मिला, कृपया ड्रॉपडाउन से चुनें।";
        }
    } catch (e) {
        statusBox.className = "pincode-status pincode-error";
        statusBox.innerText = "स्थान स्वतः लोड नहीं हो सका, कृपया सीधे चुनें।";
    }
}

// 4. देश बदलने पर व्यवहार
function handleCountryChange(country) {
    const pinGroup = document.getElementById("pincodeGroup");
    if (country !== "India") {
        pinGroup.style.display = "none";
        const stateSel = document.getElementById("state");
        const distSel = document.getElementById("district");
        stateSel.innerHTML = `<option value="${country}" selected>${country} Region</option>`;
        distSel.innerHTML = `<option value="${country}" selected>${country} District</option>`;
    } else {
        pinGroup.style.display = "block";
        loadStatesDropdown();
    }
}

// 5. सेवा क्षेत्र सूची लोड करना
async function loadSevaKshetraList() {
    const sel = document.getElementById("seva_kshetra");
    try {
        const res = await fetch(REGISTER_API);
        const data = await res.json();
        if (data.status && data.profiles && data.profiles.length > 0) {
            renderProfiles(data.profiles);
            return;
        }
    } catch(err) {
        console.log("Using fallback seva kshetra list");
    }
    renderProfiles(DEFAULT_SEVA_KSHETRA);
}

function renderProfiles(list) {
    const sel = document.getElementById("seva_kshetra");
    sel.innerHTML = '<option value="">-- अपना सेवा क्षेत्र चुनें --</option>';
    list.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.profile_id;
        opt.textContent = p.name;
        sel.appendChild(opt);
    });
}

// 6. फोटो चयन व प्रीव्यू
function previewUserPhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        photoBase64 = evt.target.result;
        document.getElementById("avatarPreview").src = photoBase64;
    };
    reader.readAsDataURL(file);
}

// 7. रजिस्ट्रेशन सबमिशन
async function handleRegistration(e) {
    e.preventDefault();
    const btn = document.getElementById("btnSubmit");
    const alertBox = document.getElementById("alertMsg");
    alertBox.style.display = "none";

    const mobileVal = document.getElementById("mobile").value.trim();
    if (mobileVal.length !== 10) {
        alertBox.innerText = "कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें!";
        alertBox.style.display = "block";
        return;
    }

    const payload = {
        full_name: document.getElementById("full_name").value.trim(),
        seva_kshetra: document.getElementById("seva_kshetra").value,
        gender: document.getElementById("gender").value,
        dob: document.getElementById("dob").value,
        country: document.getElementById("country").value,
        mobile: mobileVal,
        email: document.getElementById("email").value.trim(),
        state: document.getElementById("state").value.trim(),
        district: document.getElementById("district").value.trim(),
        address: document.getElementById("address").value.trim() + (document.getElementById("pincode").value ? " - " + document.getElementById("pincode").value : ""),
        pass: document.getElementById("password").value,
        profile_photo_base64: photoBase64
    };

    btn.innerText = "⏳ पंजीकरण हो रहा है...";
    btn.disabled = true;

    try {
        const res = await fetch(REGISTER_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status) {
            try {
                localStorage.setItem("sss_user_token", data.token);
                localStorage.setItem("sss_user_data", JSON.stringify(data.user));
            } catch(storageErr) {}

            if (window.AndroidBridge && window.AndroidBridge.onAuthSuccess) {
                window.AndroidBridge.onAuthSuccess(data.token, JSON.stringify(data.user));
            }

            alert("✅ " + data.message);
            
            if (window.AndroidBridge && window.AndroidBridge.openNativeScreen) {
                window.AndroidBridge.openNativeScreen("app_home");
            } else {
                window.location.href = "app_home.html";
            }
        } else {
            alertBox.innerText = data.message || "पंजीकरण विफल रहा!";
            alertBox.style.display = "block";
        }
    } catch(err) {
        alertBox.innerText = "सर्वर से कनेक्ट नहीं हो सका। कृपया इंटरनेट जांचें।";
        alertBox.style.display = "block";
    } finally {
        btn.innerText = "।। सदस्य पंजीकरण पूर्ण करें ।।";
        btn.disabled = false;
    }
}
</script>
