<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>सनातन सेवा समिति — अभिनंदन पत्र</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="form-page-body">

<div class="app-card" style="text-align: center;">
    <div class="logo-wrap">
        <img src="Images/jpg/logo.jpg" class="logo-img" alt="Logo" onerror="this.src='https://sanatansevasamiti.org/Images/jpg/logo.jpg';">
    </div>
    <div class="title">सनातन सेवा समिति</div>
    <div class="mantra">🚩 अभिनंदन एवं स्वागत पत्र 🚩</div>

    <div class="letter-card">
        <div class="user-info-row">
            <img id="userPhoto" src="https://via.placeholder.com/52" class="user-avatar" alt="Avatar">
            <div>
                <div class="user-name" id="userName">मान्य सदस्य</div>
                <div class="user-id" id="userIdBadge">सदस्यता स्थिति: सक्रिय (Active)</div>
            </div>
        </div>
        <p class="letter-body" id="letterText">
            सनातन सेवा समिति के इस पावन मंच पर आपका हार्दिक स्वागत और अभिनंदन है। धर्म, गौ, सेवा और संस्कृति के संरक्षण के इस पुनीत महायज्ञ में आपकी सहभागिता अत्यंत वंदनीय है।
        </p>
    </div>

    <button type="button" class="btn-action" onclick="goHome()">🏠 मुख्य पृष्ठ (Welcome Screen)</button>
    <button type="button" class="btn-action btn-secondary" onclick="logoutUser()">🚪 बाहर निकलें (Log Out)</button>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {
    try {
        const raw = localStorage.getItem("sss_user_data");
        if (raw) {
            const user = JSON.parse(raw);
            if (user.full_name) document.getElementById("userName").textContent = user.full_name;
            if (user.unique_id) document.getElementById("userIdBadge").textContent = "सदस्य ID: " + user.unique_id;
            if (user.profile_photo) {
                let p = "Images/jpg/logo.jpg";
                if (user.profile_photo.startsWith("data:image/") || user.profile_photo.startsWith("Images/")) {
                    p = user.profile_photo;
                } else if (typeof getUserProfileMediaUrl === "function") {
                    p = getUserProfileMediaUrl(user.profile_photo);
                } else {
                    const clean = user.profile_photo.replace(/^.*[\\\/]/, '').trim();
                    p = user.profile_photo.startsWith("http") ? user.profile_photo : `https://sanatansevasamiti.org/api/get_media.php?file=${encodeURIComponent(clean)}`;
                }
                const photoEl = document.getElementById("userPhoto");
                if (photoEl) {
                    photoEl.src = p;
                    photoEl.onerror = function() { this.src = "Images/jpg/logo.jpg"; };
                }
            }
        }
    } catch(e) {}
});

function goHome() {
    window.location.href = "app_home.html";
}

function logoutUser() {
    try {
        if (window.indexedDB) {
            try { window.indexedDB.deleteDatabase("sanatanam_img_cache_db"); } catch(e) {}
        }
        localStorage.clear();
        sessionStorage.clear();
        if (window.AndroidBridge && typeof window.AndroidBridge.clearUserSession === "function") {
            window.AndroidBridge.clearUserSession();
        }
    } catch(e) {}
    window.location.replace("welcome_flow.html");
}
</script>
<script src="image_cache.js"></script>
<script src="auth_guard.js"></script>
<script src="footer_nav.js"></script>

</body>
</html>
