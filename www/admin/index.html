<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SANATANAM — Admin Control Panel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   SANATANAM ADMIN — ROYAL MAROON & GOLD THEME
============================================================ */
:root {
    --bg-dark: #120104;
    --card-bg: #1e0308;
    --card-border: rgba(220, 167, 47, 0.25);
    --gold: #dca72f;
    --gold-light: #ffd866;
    --bhagwa: #a92808;
    --text-main: #fbf5e8;
    --text-muted: #bfa993;
    --status-active: #22c55e;
    --status-pending: #eab308;
    --status-rejected: #ef4444;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 50px;
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(18, 1, 4, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: #2a050c;
    border: 1px solid var(--gold);
    padding: 3px;
    object-fit: cover;
}

.brand-text h1 {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--gold-light);
}

.brand-text span {
    font-size: 0.68rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1px;
}

.admin-badge {
    padding: 4px 12px;
    border-radius: 20px;
    background: #38050e;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
}

/* MAIN CONTAINER */
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px;
}

/* STATS CARDS */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
}

.stat-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 12px;
    text-align: center;
}

.stat-val {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--gold-light);
    margin-bottom: 4px;
}

.stat-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
}

/* CONTROLS & SEARCH */
.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

.search-box {
    flex: 1;
    background: #190206;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text-main);
    font-size: 0.85rem;
    outline: none;
}

.search-box:focus {
    border-color: var(--gold);
}

.refresh-btn {
    background: linear-gradient(135deg, var(--gold), #996d19);
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    color: #000;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
}

/* USER LIST */
.user-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.user-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.user-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.user-info h3 {
    font-size: 1rem;
    color: #fff;
    margin-bottom: 2px;
}

.user-info p {
    font-size: 0.78rem;
    color: var(--text-muted);
}

.badge {
    font-size: 0.68rem;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    text-transform: uppercase;
}

.badge.active { background: rgba(34, 197, 94, 0.2); color: var(--status-active); border: 1px solid var(--status-active); }
.badge.pending { background: rgba(234, 179, 8, 0.2); color: var(--status-pending); border: 1px solid var(--status-pending); }
.badge.rejected { background: rgba(239, 68, 68, 0.2); color: var(--status-rejected); border: 1px solid var(--status-rejected); }

.user-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    font-size: 0.78rem;
    background: rgba(0, 0, 0, 0.25);
    padding: 10px;
    border-radius: 8px;
}

.user-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
}

.btn-approve {
    flex: 1;
    background: #14532d;
    border: 1px solid #22c55e;
    color: #86efac;
    padding: 8px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
}

.btn-reject {
    flex: 1;
    background: #7f1d1d;
    border: 1px solid #ef4444;
    color: #fca5a5;
    padding: 8px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
}

.loading-msg {
    text-align: center;
    padding: 40px 20px;
    color: var(--gold-light);
    font-size: 0.9rem;
}
</style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="../Images/logo.jpg" alt="Logo" class="brand-icon" onerror="this.src='https://sanatansevasamiti.org/Images/jpg/logo.jpg'">
            <div class="brand-text">
                <h1>SANATANAM</h1>
                <span>Sanatan Seva Samiti Admin</span>
            </div>
        </div>
        <div class="admin-badge">Admin Panel</div>
    </header>

    <div class="container">

        <!-- STATS COUNTERS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" id="totalUsers">0</div>
                <div class="stat-label">Total Sevadar</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="pendingUsers" style="color: var(--status-pending)">0</div>
                <div class="stat-label">Pending Verify</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="activeUsers" style="color: var(--status-active)">0</div>
                <div class="stat-label">Active Sevadar</div>
            </div>
        </div>

        <!-- SEARCH TOOLBAR -->
        <div class="toolbar">
            <input type="text" id="searchInput" class="search-box" placeholder="Search by name, mobile, unique ID..." oninput="filterUsers()">
            <button class="refresh-btn" onclick="fetchLiveUsers()">Refresh</button>
        </div>

        <!-- USERS LIST -->
        <div id="usersList" class="user-list">
            <div class="loading-msg">Connecting to Sanatanam Database...</div>
        </div>

    </div>

<script>
// API CONFIGURATION
const API_URL = "https://sanatansevasamiti.org/api/index.php";
const API_KEY = "SANATANAM_SECURE_2026";

let globalUsers = [];

// FETCH DATA FROM LIVE DATABASE
async function fetchLiveUsers() {
    const listContainer = document.getElementById("usersList");
    listContainer.innerHTML = '<div class="loading-msg">Fetching records...</div>';

    try {
        const response = await fetch(`${API_URL}?table=sanatans_sss.sss_users`, {
            method: "GET",
            headers: { "X-API-KEY": API_KEY }
        });

        const result = await response.json();

        if (result && result.data) {
            globalUsers = result.data;
            updateStats(globalUsers);
            renderUsers(globalUsers);
        } else {
            // Fallback: agar table name bina prefix ka ho
            fallbackFetch();
        }
    } catch (error) {
        console.error("Fetch Error:", error);
        fallbackFetch();
    }
}

async function fallbackFetch() {
    try {
        const res = await fetch(`${API_URL}?table=sss_users`, {
            headers: { "X-API-KEY": API_KEY }
        });
        const data = await res.json();
        if (data && data.data) {
            globalUsers = data.data;
            updateStats(globalUsers);
            renderUsers(globalUsers);
        } else {
            document.getElementById("usersList").innerHTML = '<div class="loading-msg">No records found or API offline.</div>';
        }
    } catch (e) {
        document.getElementById("usersList").innerHTML = '<div class="loading-msg">Unable to connect to live API. Check network.</div>';
    }
}

function updateStats(users) {
    document.getElementById("totalUsers").innerText = users.length;
    document.getElementById("pendingUsers").innerText = users.filter(u => u.status === 'pending' || !u.status).length;
    document.getElementById("activeUsers").innerText = users.filter(u => u.status === 'active' || u.status === 'approved').length;
}

function renderUsers(users) {
    const container = document.getElementById("usersList");
    if (!users || users.length === 0) {
        container.innerHTML = '<div class="loading-msg">No members found.</div>';
        return;
    }

    container.innerHTML = users.map(user => {
        const status = (user.status || 'pending').toLowerCase();
        return `
            <div class="user-card">
                <div class="user-header">
                    <div class="user-info">
                        <h3>${user.full_name || 'Sevadar'}</h3>
                        <p>ID: ${user.unique_id || user.id || 'N/A'} • Mobile: ${user.mobile || 'N/A'}</p>
                    </div>
                    <span class="badge ${status}">${status}</span>
                </div>
                <div class="user-details">
                    <div><strong>Kshetra:</strong> ${user.seva_kshetra || 'General'}</div>
                    <div><strong>State:</strong> ${user.state || 'N/A'}</div>
                    <div><strong>District:</strong> ${user.district || 'N/A'}</div>
                    <div><strong>Wallet:</strong> ₹${user.wallet_balance || '0.00'}</div>
                </div>
                <div class="user-actions">
                    <button class="btn-approve" onclick="updateStatus('${user.id}', 'active')">Approve / Active</button>
                    <button class="btn-reject" onclick="updateStatus('${user.id}', 'rejected')">Reject</button>
                </div>
            </div>
        `;
    }).join('');
}

function filterUsers() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    const filtered = globalUsers.filter(u => 
        (u.full_name && u.full_name.toLowerCase().includes(q)) ||
        (u.mobile && u.mobile.includes(q)) ||
        (u.unique_id && u.unique_id.toLowerCase().includes(q))
    );
    renderUsers(filtered);
}

async function updateStatus(id, newStatus) {
    if (!confirm(`Are you sure you want to mark this user as ${newStatus}?`)) return;

    try {
        const response = await fetch(`${API_URL}?table=sss_users&id=${id}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-API-KEY": API_KEY
            },
            body: JSON.stringify({ status: newStatus })
        });
        alert(`Status updated to ${newStatus}`);
        fetchLiveUsers();
    } catch (e) {
        alert("Error updating status. Please verify API write permissions.");
    }
}

// Initial load
window.addEventListener("DOMContentLoaded", fetchLiveUsers);
</script>
</body>
</html>
