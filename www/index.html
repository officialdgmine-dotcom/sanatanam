<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SANATANAM</title>
    <style>
        body { margin: 0; background: #800000; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .loader { width: 40px; height: 40px; border: 4px solid #ffd700; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <script>
        (function() {
            try {
                const userData = localStorage.getItem("sss_user_data");
                if (userData) {
                    const u = JSON.parse(userData);
                    if (u && (u.id || u.unique_id)) {
                        window.location.replace("home.html");
                        return;
                    }
                }
            } catch (e) {
                console.error("Auth check error:", e);
            }
            // यदि लॉग-इन नहीं है, तो अनिवार्य रूप से welcome.html पर भेजें
            window.location.replace("welcome.html");
        })();
    </script>
</body>
</html>
