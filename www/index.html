<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SANATANAM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top, #FF8800 0%, #B82E00 45%, #4A0000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        .splash-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .logo-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #ffffff;
            padding: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 25px rgba(255, 215, 0, 0.6);
            border: 3px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 1.8s infinite;
        }
        .logo-circle img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .app-name {
            margin-top: 18px;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffd700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        .app-sub {
            margin-top: 6px;
            font-size: 13px;
            color: #ffe4b5;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .spinner {
            margin-top: 24px;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="logo-circle">
            <img src="https://sanatansevasamiti.org/Images/jpg/logo.jpg" alt="SANATANAM Logo" onerror="this.style.display='none';">
        </div>
        <div class="app-name">SANATANAM</div>
        <div class="app-sub">सनातन सेवा समिति • अधिकृत पोर्टल</div>
        <div class="spinner"></div>
    </div>

    <script>
        // Fail-safe router: Checks local storage and redirects immediately
        (function routeUser() {
            try {
                const userData = localStorage.getItem("sss_user_data");
                setTimeout(() => {
                    if (userData) {
                        window.location.replace("home.html");
                    } else {
                        window.location.replace("app_login.html");
                    }
                }, 400);
            } catch (err) {
                console.error("[Route Error]", err);
                // Safe fallback to login screen
                window.location.replace("app_login.html");
            }
        })();
    </script>
</body>
</html>
