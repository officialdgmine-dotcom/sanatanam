<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SANATANAM — Member Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
    --maroon-900:#3a0710; --maroon-800:#520b17;
    --orange-700:#d95a00; --orange:#f47712;
    --white:#ffffff; --text:#321217;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{
    margin:0; min-height:100vh; font-family:Inter,sans-serif; color:var(--text);
    background:linear-gradient(150deg,#2a050b 0%,#4d0915 42%,#26050a 100%);
}
.app-shell{ width:100%; max-width:520px; min-height:100vh; margin:0 auto; background:#fffdf7; }
.royal-header{
    padding:35px 20px 25px; text-align:center; color:white;
    background:linear-gradient(145deg,#35060d,#620d1b 58%,#861a28);
    border-bottom-left-radius:35px; border-bottom-right-radius:35px;
}
.app-name{ font-family:Cinzel,serif; font-size:24px; font-weight:800; letter-spacing:2px; }
.main-content{ padding:20px 16px 40px; }
.form-card{ background:#fff; border-radius:24px; box-shadow:0 15px 40px rgba(0,0,0,.08); padding:18px 16px; border:1px solid #ebdcd5; }
.form-group{ margin-bottom:14px; }
.field-label{ display:block; margin-bottom:6px; font-size:11px; font-weight:800; color:#54101b; }
.input-box, .select-box, .textarea-box{
    width:100%; min-height:48px; border-radius:14px; border:1px solid #ead8ca;
    padding:0 14px; font-size:12px; font-weight:600; outline:none; background:#fffdf9;
}
.phone-row{ display:flex; gap:8px; }
.btn-otp{
    flex:none; padding:0 16px; min-height:48px; border:0; border-radius:14px;
    background:linear-gradient(135deg,var(--maroon-800),var(--orange-700));
    color:#fff; font-size:11px; font-weight:800; cursor:pointer;
}
.otp-box{
    margin-top:12px; padding:15px; border-radius:18px; background:#fffaf0;
    border:1.5px solid rgba(217,90,0,.3); display:none;
}
.digits-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:12px; }
.digit-input{
    width:100%; height:48px; border-radius:12px; border:1.5px solid #e0c8b8;
    text-align:center; font-size:18px; font-weight:800; outline:none; background:#fff;
}
.btn-verify{
    width:100%; min-height:44px; border:0; border-radius:12px;
    background:#1e7e34; color:#fff; font-size:12px; font-weight:800; cursor:pointer;
}
.verified-tag{
    display:none; padding:9px 12px; border-radius:12px; background:#eafcf0;
    color:#126c2e; font-size:11px; font-weight:800; margin-top:8px;
}
.btn-submit{
    width:100%; min-height:54px; border:0; border-radius:16px; margin-top:15px;
    background:linear-gradient(115deg,#570914,#b83f08); color:#fff;
    font-family:Cinzel,serif; font-size:13px; font-weight:800; cursor:pointer;
}
.btn-submit:disabled{ opacity:.55; cursor:not-allowed; background:#88726b; }
.alert-box{ display:none; padding:10px 12px; border-radius:12px; font-size:11px; font-weight:700; margin-bottom:12px; }
.alert-error{ background:#fff0f0; color:#9c1e2c; border:1px solid #f0b8b8; }
.alert-success{ background:#f0fff4; color:#197a38; border:1px solid #b8f0ca; }
</style>
</head>
<body>

<div class="app-shell">
    <header class="royal-header">
        <div class="app-name">SANATANAM</div>
        <div style="font-size:9px; letter-spacing:1.5px; opacity:.85; margin-top:4px;">A LIVING SPIRITUAL EXPERIENCE</div>
    </header>

    <main class="main-content">
        <div class="form-card">
            <div id="alertMsg" class="alert-box"></div>

            <form id="regForm" onsubmit="handleRegistration(event)">
                <div class="form-group">
                    <label class="field-label">Seva Area *</label>
                    <select id="seva_kshetra" class="select-box" required><option value="">Loading...</option></select>
                </div>

                <div class="form-group">
                    <label class="field-label">Full Name *</label>
                    <input type="text" id="full_name" class="input-box" placeholder="आपका पूरा नाम" required>
                </div>

                <div class="form-group">
                    <label class="field-label">Mobile Number *</label>
                    <div class="phone-row">
                        <input type="tel" id="mobile" class="input-box" placeholder="10 अंकों का नंबर" maxlength="10" inputmode="numeric" required>
                        <button type="button" id="btnSendOtp" class="btn-otp" onclick="sendServerOTP()">Get OTP</button>
                    </div>
                    <div id="verifiedBadge" class="verified-tag">✓ मोबाइल नंबर सफलतापूर्वक सत्यापित हो गया!</div>
                </div>

                <!-- OTP BOX -->
                <div class="otp-box" id="otpSection">
                    <div style="font-size:11px; font-weight:800; color:var(--maroon-900); margin-bottom:10px;">
                        🔑 दर्ज करें 6 अंकों का OTP:
                    </div>
                    <div class="digits-grid">
                        <input type="tel" class="digit-input" maxlength="1" oninput="stepDigit(this,0)" onkeydown="delDigit(event,0)">
                        <input type="tel" class="digit-input" maxlength="1" oninput="stepDigit(this,1)" onkeydown="delDigit(event,1)">
                        <input type="tel" class="digit-input" maxlength="1" oninput="stepDigit(this,2)" onkeydown="delDigit(event,2)">
                        <input type="tel" class="digit-input" maxlength="1" oninput="stepDigit(this,3)" onkeydown="delDigit(event,3)">
                        <input type="tel" class="digit-input" maxlength="1" oninput="stepDigit(this,4)" onkeydown="delDigit(event,4)">
                        <input type="tel" class="digit-input" maxlength="1" oninput="stepDigit(this,5)" onkeydown="delDigit(event,5)">
                    </div>
                    <button type="button" class="btn-verify" onclick="verifyServerOTP()">Verify OTP</button>
                </div>

                <div class="form-group">
                    <label class="field-label">Profile Photo</label>
                    <input type="file" id="profile_photo" accept="image/*" onchange="readPhoto(event)">
                </div>

                <div class="form-group">
                    <label class="field-label">Password *</label>
                    <input type="password" id="password" class="input-box" placeholder="कम से कम 6 अक्षर" minlength="6" required>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit" disabled>
                    VERIFY OTP FIRST TO REGISTER
                </button>
            </form>
        </div>
    </main>
</div>

<script>
const OTP_API = "https://sanatansevasamiti.org/api/otp_handler.php";
const REG_API = "https://sanatansevasamiti.org/api/register.php";
let isVerified = false;
let photoBase64 = "";

function showAlert(msg, isErr=true){
    const b = document.getElementById("alertMsg");
    b.className = "alert-box " + (isErr ? "alert-error" : "alert-success");
    b.innerText = msg; b.style.display = "block";
}

async function sendServerOTP(){
    const m = document.getElementById("mobile").value.trim();
    if(m.length !== 10) return showAlert("10 अंकों का सही नंबर डालें।");
    
    const btn = document.getElementById("btnSendOtp");
    btn.disabled = true; btn.innerText = "...";

    try{
        const r = await fetch(OTP_API, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({action: "send", mobile: m})
        });
        const res = await r.json();
        if(res.status){
            showAlert(res.message + (res.debug_otp ? " (Your OTP: " + res.debug_otp + ")" : ""), false);
            document.getElementById("otpSection").style.display = "block";
            document.querySelectorAll(".digit-input")[0].focus();
        } else {
            showAlert(res.message);
        }
    } catch(e){
        showAlert("सर्वर से कनेक्शन नहीं हो सका।");
    } finally {
        btn.disabled = false; btn.innerText = "Get OTP";
    }
}

function stepDigit(el, i){
    const d = document.querySelectorAll(".digit-input");
    el.value = el.value.replace(/[^0-9]/g, '');
    if(el.value.length === 1 && i < 5) d[i+1].focus();
}
function delDigit(e, i){
    const d = document.querySelectorAll(".digit-input");
    if(e.key === "Backspace" && !d[i].value && i > 0) d[i-1].focus();
}

async function verifyServerOTP(){
    const m = document.getElementById("mobile").value.trim();
    const otp = Array.from(document.querySelectorAll(".digit-input")).map(i=>i.value).join('');
    if(otp.length !== 6) return showAlert("6 अंकों का पूरा OTP दर्ज करें।");

    try{
        const r = await fetch(OTP_API, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({action: "verify", mobile: m, otp: otp})
        });
        const res = await r.json();
        if(res.status){
            isVerified = true;
            showAlert("सत्यापन सफल! अब आप रजिस्टर कर सकते हैं।", false);
            document.getElementById("otpSection").style.display = "none";
            document.getElementById("verifiedBadge").style.display = "block";
            document.getElementById("mobile").readOnly = true;
            document.getElementById("btnSendOtp").style.display = "none";
            
            const sub = document.getElementById("btnSubmit");
            sub.disabled = false; sub.innerText = "COMPLETE REGISTRATION";
        } else {
            showAlert(res.message);
        }
    } catch(e){
        showAlert("OTP सत्यापन में त्रुटि हुई।");
    }
}

function readPhoto(e){
    const f = e.target.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = ev => photoBase64 = ev.target.result;
    rd.readAsDataURL(f);
}

// Load Profiles
window.onload = async () => {
    try{
        const r = await fetch(REG_API);
        const d = await r.json();
        const s = document.getElementById("seva_kshetra");
        s.innerHTML = '<option value="">सेवा क्षेत्र चुनें</option>';
        d.profiles.forEach(p => s.innerHTML += `<option value="${p.profile_id}">${p.name}</option>`);
    }catch(e){}
};

async function handleRegistration(e){
    e.preventDefault();
    if(!isVerified) return showAlert("कृपया पहले मोबाइल OTP वेरिफाई करें।");

    const payload = {
        full_name: document.getElementById("full_name").value.trim(),
        seva_kshetra: document.getElementById("seva_kshetra").value,
        mobile: document.getElementById("mobile").value.trim(),
        pass: document.getElementById("password").value,
        profile_photo_base64: photoBase64
    };

    const btn = document.getElementById("btnSubmit");
    btn.disabled = true; btn.innerText = "पंजीकरण हो रहा है...";

    try{
        const r = await fetch(REG_API, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(payload)
        });
        const res = await r.json();
        if(res.status){
            alert("पंजीकरण सफलतापूर्वक संपन्न हुआ!");
            window.location.href = "app_home.html";
        } else {
            showAlert(res.message);
            btn.disabled = false; btn.innerText = "COMPLETE REGISTRATION";
        }
    }catch(e){
        showAlert("पंजीकरण में त्रुटि आई।");
        btn.disabled = false;
    }
}
</script>
</body>
</html>
