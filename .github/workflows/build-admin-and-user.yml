name: Build User and Admin APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Both APK Flavors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Keystore and Env
        run: |
          echo "=== Setting up Build Environment ==="
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Sync Assets
        run: |
          mkdir -p www/Images www/uploads app/src/main/assets
          if [ -d "app/src/main/assets" ] && [ -d "www" ]; then
            cp -r www/* app/src/main/assets/ 2>/dev/null || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Stable Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Grant Executable Permission
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build User and Admin APKs
        run: |
          echo "=== Building All Product Flavors (User & Admin) ==="
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and Collect Both APKs
        run: |
          echo "=== Collecting User and Admin APKs ==="
          mkdir -p build-artifacts
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} build-artifacts/ \;
          ls -la build-artifacts/

      - name: Upload User and Admin APKs
        uses: actions/upload-artifact@v4
        with:
          name: SANATANAM-User-and-Admin-APKs
          path: build-artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30
