name: Build User and Admin APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Both APK Flavors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Keystore and Env
        run: |
          echo "=== Setting up Build Environment ==="
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Sync Web Assets
        run: |
          echo "=== Syncing Assets including Admin Folder ==="
          mkdir -p app/src/main/assets
          if [ -d "www" ]; then
            cp -r www/* app/src/main/assets/ 2>/dev/null || true
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Compatible with SDK 36
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Grant Executable Permission
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build User and Admin APKs
        run: |
          echo "=== Building User and Admin Flavors ==="
          if [ -f "./gradlew" ]; then
            ./gradlew assembleUserDebug --no-daemon --stacktrace || true
            ./gradlew assembleAdminDebug --no-daemon --stacktrace || true
          else
            gradle assembleUserDebug --stacktrace || true
            gradle assembleAdminDebug --stacktrace || true
          fi

      - name: Locate and Package Output APKs
        run: |
          echo "=== Collecting User and Admin APKs ==="
          mkdir -p build-artifacts
          
          # Find User APK
          USER_APK=$(find app/build/outputs/apk/user/debug/ -type f -name "*.apk" | head -n 1)
          if [ -n "$USER_APK" ]; then
            echo "Found User APK: $USER_APK"
            cp "$USER_APK" build-artifacts/SANATANAM-User-Debug.apk
          fi

          # Find Admin APK
          ADMIN_APK=$(find app/build/outputs/apk/admin/debug/ -type f -name "*.apk" | head -n 1)
          if [ -n "$ADMIN_APK" ]; then
            echo "Found Admin APK: $ADMIN_APK"
            cp "$ADMIN_APK" build-artifacts/SANATANAM-Admin-Debug.apk
          fi

          # Fallback: Agar kisi vajah se path alag ho toh sabhi copy karein
          if [ ! -f "build-artifacts/SANATANAM-User-Debug.apk" ] && [ ! -f "build-artifacts/SANATANAM-Admin-Debug.apk" ]; then
            find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} build-artifacts/ \;
          fi

          ls -lh build-artifacts/

      - name: Upload User and Admin APKs
        uses: actions/upload-artifact@v4
        with:
          name: SANATANAM-User-and-Admin-APKs
          path: build-artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30
